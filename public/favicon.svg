<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="FOMO Tours">
  <defs>
    <!-- Soft shadow for visibility on dark and light browser chrome -->
    <filter id="badge-shadow" x="-4" y="-2" width="72" height="72" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#14120E" flood-opacity="0.18" />
    </filter>
    <clipPath id="fomo-lion-clip">
      <circle cx="32" cy="32" r="28" />
    </clipPath>
  </defs>

  <!-- High-contrast brand circle badge -->
  <g filter="url(#badge-shadow)">
    <!-- Base circle in signature FOMO Orange -->
    <circle cx="32" cy="32" r="28" fill="#EB5E28" />
    <circle cx="32" cy="32" r="27.25" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
  </g>

  <!-- Crisp white roaring lion profile clipped inside circle -->
  <g clip-path="url(#fomo-lion-clip)">
    <path
      d="M2 9
         L15 10 L12 12.5 L22 13.5 L19.5 16 L29 17.5
         L36 21 L35 23 L41 25.5
         L50.5 31.5 L50 34.5 L45.5 36.5
         L48 39 L45.5 41.5 L39.5 41.5
         L34.5 45.5 L35.5 50.5 L31 54.5 L31.5 61
         L23.5 61
         C21.5 55 22 48.5 25.5 43.5
         C21 46 18.5 52.5 20 61
         L2 61 Z"
      fill="#FFFFFF"
    />
    <!-- Eye accent in brand orange -->
    <polygon points="35.5,24.5 39.5,26 36.5,27" fill="#EB5E28" />
  </g>
</svg>
