<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      background: #E6AEB9; /* The exact dusty rose theme */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #canvas-container {
      width: 400px;
      height: 400px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const width = 400;
    const height = 400;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 100);
    camera.position.set(0, 3.2, 6.8);
    camera.lookAt(0, 0.7, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(2);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    // Warm studio bakery lighting
    const ambientLight = new THREE.AmbientLight(0xfff6ee, 2.0);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(4, 8, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffe6d6, 1.4);
    fillLight.position.set(-5, 4, -2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffeedd, 1.8);
    rimLight.position.set(0, 6, -6);
    scene.add(rimLight);

    // Turntable Group
    const turntableGroup = new THREE.Group();
    scene.add(turntableGroup);

    // Turntable chrome pedestal
    const chromeMat = new THREE.MeshStandardMaterial({
      color: 0xe8e4df,
      metalness: 0.9,
      roughness: 0.16
    });

    const discMesh = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.12, 64), chromeMat);
    discMesh.position.y = -0.06;
    turntableGroup.add(discMesh);

    const rimMesh = new THREE.Mesh(new THREE.TorusGeometry(2.18, 0.045, 16, 64), chromeMat);
    rimMesh.rotation.x = Math.PI / 2;
    rimMesh.position.y = -0.01;
    turntableGroup.add(rimMesh);

    const stemMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 0.45, 32), chromeMat);
    stemMesh.position.y = -0.34;
    turntableGroup.add(stemMesh);

    const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.65, 0.16, 32), chromeMat);
    baseMesh.position.y = -0.64;
    turntableGroup.add(baseMesh);

    // Load Photorealistic Scan
    const loader = new GLTFLoader();
    loader.load('/models/strawberry_chocolate_cake/strawberry_chocolate_cake.gltf', (gltf) => {
      const cake = gltf.scene;
      
      // Compute bounding box to auto-center and scale
      const box = new THREE.Box3().setFromObject(cake);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const targetScale = 3.2 / maxDim;
      cake.scale.setScalar(targetScale);
      
      box.setFromObject(cake);
      cake.position.y = -box.min.y; // Sit flat on turntable
      
      turntableGroup.add(cake);
      window.__READY__ = true;
      console.log('Cake loaded and mounted on turntable!');
    }, undefined, console.error);

    function animate() {
      requestAnimationFrame(animate);
      turntableGroup.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
