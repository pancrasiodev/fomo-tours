<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 114" fill="none" role="img" aria-label="FOMO Tours">
  <defs>
    <!-- Clip lion silhouette cleanly to the first 'o' circle -->
    <clipPath id="lion-circle">
      <circle cx="72" cy="56" r="28" />
    </clipPath>
  </defs>

  <!-- 'f' in vibrant brand blue -->
  <path
    d="M13 84V40H4V27H13V23C13 10.5 20.5 4 33.5 4C37.5 4 41 4.6 43 5.3V17.5C41.2 16.9 38.8 16.5 36.2 16.5C31.2 16.5 29 18.8 29 23.8V27H42V40H29V84H13Z"
    fill="#2474CC"
  />

  <!-- First 'o': Orange circle + crisp white roaring lion profile -->
  <g clip-path="url(#lion-circle)">
    <circle cx="72" cy="56" r="28" fill="#EB5E28" />
    <!-- White lion head & mane silhouette facing right -->
    <path
      d="M42 33
         L55 34 L52 36.5 L62 37.5 L59.5 40 L69 41.5
         L76 45 L75 47 L81 49.5
         L90.5 55.5 L90 58.5 L85.5 60.5
         L88 63 L85.5 65.5 L79.5 65.5
         L74.5 69.5 L75.5 74.5 L71 78.5 L71.5 85
         L63.5 85
         C61.5 79 62 72.5 65.5 67.5
         C61 70 58.5 76.5 60 85
         L42 85 Z"
      fill="#FFFFFF"
    />
    <!-- Subtle eye & mane accent in orange -->
    <polygon points="75.5,48.5 79.5,50 76.5,51" fill="#EB5E28" />
  </g>

  <!-- 'm' in vibrant brand blue -->
  <path
    d="M105 84V29H120.5V35.2C123.8 30.6 129.2 28 135.8 28C142.8 28 148.3 30.9 151.4 36.2C155.3 30.8 161.4 28 168.6 28C180.2 28 188 35.8 188 48.6V84H172V51.2C172 44.2 168.4 40.4 162.5 40.4C156.6 40.4 152.8 44.5 152.8 51.4V84H137V51.2C137 44.2 133.4 40.4 127.5 40.4C121.6 40.4 117.8 44.5 117.8 51.4V84H105Z"
    fill="#2474CC"
  />

  <!-- Second 'o': Orange circle with white center & orbiting airplane + contrail -->
  <g>
    <circle cx="224" cy="56" r="28" fill="#EB5E28" />
    <circle cx="224" cy="56" r="11.5" fill="#FFFFFF" />
    <!-- Sweeping white contrail arc clockwise around the ring -->
    <path
      d="M227 36.2 A 19.8 19.8 0 1 1 207.2 66.5"
      stroke="#FFFFFF"
      stroke-width="2.4"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M231 40.2 A 16.5 16.5 0 0 1 236.5 67.5"
      stroke="#FFFFFF"
      stroke-width="1.3"
      stroke-linecap="round"
      opacity="0.85"
      fill="none"
    />
    <!-- Crisp white airplane icon at top of orbit (~11:30–12:00 heading upper-left/clockwise) -->
    <path
      d="M216.5 34.5 L225.5 32.5 L222.5 36.8 L226.2 40.2 L224.3 41.4 L220.2 38.5 L217.2 41.5 L216.5 39.8 L218.2 37.2 L214.8 35.8 Z"
      fill="#FFFFFF"
    />
  </g>

  <!-- Spaced 't o u r s . . .' subtitle -->
  <g fill="#4A90E2" font-family="Manrope, system-ui, sans-serif" font-size="13.5" font-weight="700">
    <text x="12" y="106">t</text>
    <text x="41" y="106">o</text>
    <text x="73" y="106">u</text>
    <text x="105" y="106">r</text>
    <text x="134" y="106">s</text>
  </g>
  <circle cx="167" cy="104.5" r="1.5" fill="#4A90E2" opacity="0.75" />
  <circle cx="193" cy="104.5" r="1.5" fill="#EB5E28" opacity="0.75" />
  <circle cx="219" cy="104.5" r="1.5" fill="#EB5E28" opacity="0.75" />
</svg>
